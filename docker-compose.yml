name: qwen3-asr-ascend

services:
  qwen3-asr:
    image: qwen3-asr:ascend-910b
    container_name: qwen3-asr
    restart: unless-stopped

    ports:
      - "17003:8000"

    shm_size: 1g

    build:
      context: .
      dockerfile: Dockerfile.ascend
    environment:
      DEVICE: npu:0
      ALIGNMENT_MODE: uniform
      SPEAKER_DIARIZATION_DEVICE: cpu
      R2T2_MAX_MODEL_LEN: "16384"
      R2T2_GPU_MEMORY_UTILIZATION: "0.85"
      R2T2_ENFORCE_EAGER: "1"
      R2T2_CHUNK_SECONDS: "0.64"
    volumes:
      - ./models/huggingface/hub:/root/.cache/huggingface/hub
      - ./models/nemotron-3-diarization:/models/nemotron-3-diarization
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/dcmi:/usr/local/dcmi:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
    devices:
      - /dev/davinci0:/dev/davinci0
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/devmm_svm:/dev/devmm_svm
      - /dev/hisi_hdc:/dev/hisi_hdc
    stop_grace_period: 45s
