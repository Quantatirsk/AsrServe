name: Build R2T2 Images

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: Dockerfile.gpu
            platform: linux/amd64
            runner: ubuntu-latest
          - file: Dockerfile.cpu
            platform: linux/amd64
            runner: ubuntu-latest
          - file: Dockerfile.cpu
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: false
          tags: asrserve:ci
          cache-from: type=gha,scope=${{ matrix.file }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.file }}-${{ matrix.platform }}
