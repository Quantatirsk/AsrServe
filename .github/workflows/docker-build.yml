name: Ascend Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra cpu
      - run: >-
          uv run --frozen --extra cpu python -m pytest -q
          tests/test_ascend_smoke.py tests/test_single_container.py
          tests/test_r2t2_offline.py tests/test_diarized_pipeline.py
          tests/test_segment_bounds.py tests/test_speaker_diarizer.py
          tests/test_speaker_attribution.py tests/test_shared_inference.py
          tests/test_realtime.py tests/test_api_contract.py
      - run: uv run --frozen --extra cpu python -m compileall -q app deploy
      - run: bash -n scripts/prepare-models.sh
      - run: docker compose -f compose.ascend.yml config --quiet
      - run: docker build --check -f Dockerfile.ascend .

  publish:
    needs: smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        run: echo "version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ascend
          platforms: linux/arm64
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            quantatrisk/asrserve:ascend
            quantatrisk/asrserve:${{ steps.version.outputs.version }}-ascend
          push: true
