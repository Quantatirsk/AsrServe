<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="page-title">Realtime Transcription · AsrServe</title>
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182e29; background: #f3f6f3; }
  body { max-width: 820px; margin: 8vh auto; padding: 0 24px; }
  header { margin-bottom: 32px; } h1 { font-size: 36px; letter-spacing: -1px; margin-bottom: 8px; }
  p, #status { color: #5e706b; line-height: 1.6; }
  main { background: white; padding: 28px; border: 1px solid #dce5df; border-radius: 18px; }
  label { display: block; font-size: 14px; margin-bottom: 8px; }
  input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #cbd8cf; border-radius: 8px; }
  .buttons { display: flex; gap: 10px; margin: 22px 0 16px; }
  button { border: 0; background: #19644c; color: white; border-radius: 9px; padding: 12px 22px; font: inherit; cursor: pointer; }
  button.secondary { background: #e9f0ec; color: #294b3e; } button:disabled { opacity: .4; cursor: default; }
  #text { min-height: 240px; font-size: 23px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere; }
  #text:empty::before { content: attr(data-placeholder); color: #a1afa7; }
  #status { font-size: 14px; } footer { margin-top: 18px; font-size: 13px; color: #74847b; }
</style>
<header><h1 id="page-heading">Realtime Transcription</h1><p id="page-description">Enable microphone for live transcription. Automatic Chinese/English detection, no language switching needed.</p></header>
<main>
  <label for="key" id="api-key-label">API Key (if authentication is enabled)</label><input id="key" type="password" autocomplete="off" placeholder="Optional">
  <div class="buttons"><button id="start" data-i18n="start_button">Start Recording</button><button id="stop" class="secondary" disabled data-i18n="stop_button">Stop Recording</button><button id="copy" class="secondary" data-i18n="copy_button">Copy Text</button></div>
  <div id="status" role="status" data-i18n="status_ready">Ready</div><hr style="border:0;border-top:1px solid #edf1ee;margin:20px 0">
  <div id="text" aria-live="polite" data-placeholder="Transcribed text will appear here..."></div>
</main>
<footer id="page-footer">R2T2 · Independent transcription per connection · End of text finalized after stopping recording</footer>
<script type="module">
// i18n translations
const i18n = {
  en: {
    page_title: "Realtime Transcription · AsrServe",
    page_heading: "Realtime Transcription",
    page_description: "Enable microphone for live transcription. Automatic Chinese/English detection, no language switching needed.",
    api_key_label: "API Key (if authentication is enabled)",
    api_key_placeholder: "Optional",
    start_button: "Start Recording",
    stop_button: "Stop Recording",
    copy_button: "Copy Text",
    status_ready: "Ready",
    status_connecting: "Connecting...",
    status_listening: "Listening · Auto-detecting Chinese/English",
    status_complete: "Transcription complete",
    status_copy_done: "Copied",
    status_copy_error: "Please select text and copy manually.",
    status_closed: "Connection closed",
    status_timeout: "Connection timed out, please try again.",
    status_failed: "Connection failed, please check service and API Key.",
    status_network_slow: "Network too slow, please reconnect.",
    status_finalizing: "Finalizing end of text...",
    status_finalizing_timeout: "Transcription ended timed out, please try again.",
    placeholder_text: "Transcribed text will appear here...",
    footer: "R2T2 · Independent transcription per connection · End of text finalized after stopping recording",
    mic_error: "Please open the page via HTTPS reverse proxy or localhost to use the microphone.",
    sample_rate_error: "Audio sample rate mismatch."
  },
  zh: {
    page_title: "实时转写 · AsrServe",
    page_heading: "实时转写",
    page_description: "开启麦克风，即时呈现文字。中英文自动识别，无需切换语言。",
    api_key_label: "API Key（服务开启鉴权时填写）",
    api_key_placeholder: "可选",
    start_button: "开始录音",
    stop_button: "结束录音",
    copy_button: "复制文字",
    status_ready: "准备就绪",
    status_connecting: "正在连接…",
    status_listening: "正在聆听 · 自动识别中英文",
    status_complete: "转写完成",
    status_copy_done: "已复制",
    status_copy_error: "请选中文字后复制。",
    status_closed: "连接已关闭",
    status_timeout: "连接超时，请重试。",
    status_failed: "连接失败，请检查服务和 API Key。",
    status_network_slow: "网络过慢，请重新连接。",
    status_finalizing: "正在补齐末尾文字…",
    status_finalizing_timeout: "转写结束超时，请重试。",
    placeholder_text: "转写文字会出现在这里…",
    footer: "R2T2 · 每个连接独立转写 · 停止录音后会补齐末尾文字",
    mic_error: "请通过 HTTPS 反向代理或 localhost 打开页面以使用麦克风。",
    sample_rate_error: "音频采样率不匹配。"
  }
};

// Detect locale from query parameter or default to 'en'
const params = new URLSearchParams(window.location.search);
const locale = params.get('locale') || 'en';
const strings = i18n[locale] || i18n.en;

// Apply translations
function applyTranslations() {
  document.documentElement.lang = locale === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('page-title').textContent = strings.page_title;
  document.getElementById('page-heading').textContent = strings.page_heading;
  document.getElementById('page-description').textContent = strings.page_description;
  document.getElementById('api-key-label').textContent = strings.api_key_label;
  document.getElementById('key').placeholder = strings.api_key_placeholder;
  document.getElementById('start').textContent = strings.start_button;
  document.getElementById('stop').textContent = strings.stop_button;
  document.getElementById('copy').textContent = strings.copy_button;
  document.getElementById('status').textContent = strings.status_ready;
  document.getElementById('text').setAttribute('data-placeholder', strings.placeholder_text);
  document.getElementById('page-footer').textContent = strings.footer;
}
applyTranslations();

const $ = id => document.getElementById(id);
let ws, stream, context, node, timer, stopping = false;
async function cleanup(reset = true) {
  if (reset) clearTimeout(timer);
  stream?.getTracks().forEach(t => t.stop());
  node?.disconnect();
  if (context && context.state !== 'closed') await context.close();
  stream = context = node = null;
  if (reset) { $('start').disabled = false; $('stop').disabled = true; $('key').disabled = false; }
}
function fail(message) { $('status').textContent = message; ws?.close(); cleanup(); }
$('start').onclick = async () => {
  $('start').disabled = true; $('key').disabled = true; $('text').textContent = ''; stopping = false;
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw Error(strings.mic_error);
    $('status').textContent = strings.status_connecting;
    stream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true}});
    context = new AudioContext({sampleRate: 16000});
    await context.resume();
    await context.audioWorklet.addModule('./realtime/recorder.js');
    const url = new URL('./v1/stream', location.href);
    url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    if ($('key').value.trim()) url.searchParams.set('token', $('key').value.trim());
    ws = new WebSocket(url);
    timer = setTimeout(() => fail(strings.status_timeout), 15000);
    ws.onopen = () => ws.send('{}');
    ws.onerror = () => fail(strings.status_failed);
    ws.onclose = () => { if ($('stop').disabled === false) $('status').textContent = strings.status_closed; cleanup(); };
    ws.onmessage = async ({data}) => {
      const event = JSON.parse(data);
      if (event.error) { fail(event.error); return; }
      if (event.ready) {
        clearTimeout(timer);
        if (event.sample_rate !== context.sampleRate) { fail(strings.sample_rate_error); return; }
        node = new AudioWorkletNode(context, 'recorder');
        node.port.onmessage = ({data}) => {
          if (ws.readyState !== WebSocket.OPEN) return;
          if (data === 'stopped') { ws.send('end'); cleanup(false); return; }
          if (ws.bufferedAmount > 32000 * 5) { fail(strings.status_network_slow); return; }
          ws.send(data);
        };
        context.createMediaStreamSource(stream).connect(node);
        node.connect(context.destination);
        $('stop').disabled = false; $('status').textContent = strings.status_listening;
      } else {
        if (event.delta) $('text').append(document.createTextNode(event.delta));
        if (event.done) {
          $('text').textContent = event.text;
          $('status').textContent = strings.status_complete; ws.close(); await cleanup();
        }
      }
    };
  } catch (error) { fail(error.message); }
};
$('stop').onclick = () => {
  if (stopping) return;
  stopping = true; $('stop').disabled = true; $('status').textContent = strings.status_finalizing;
  node?.port.postMessage('stop');
  timer = setTimeout(() => fail(strings.status_finalizing_timeout), 30000);
};
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('text').textContent); $('status').textContent = strings.status_copy_done; }
  catch { $('status').textContent = strings.status_copy_error; }
};
window.addEventListener('pagehide', () => { ws?.close(); stream?.getTracks().forEach(t => t.stop()); });
</script>
</html>
