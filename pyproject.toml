[project]
name = "AsrServe"
version = "1.0.5"
description = "R2T2 offline and streaming speech recognition for CUDA and CPU"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.136.3",
  "fastapi-offline==1.7.6",
  "uvicorn[standard]==0.40.0",
  "pydantic==2.12.0",
  "python-multipart==0.0.22",
  "funasr==1.3.1",
  "modelscope==1.34.0",
  "requests==2.34.2",
  "soundfile==0.13.1",
  "librosa==0.11.0",
  "soxr==1.0.0",
  "websockets==16.0",
  "scipy==1.15.3; sys_platform == 'linux'",
  "scipy==1.16.3; sys_platform == 'darwin'",
  "python-dotenv==1.2.1",
  "huggingface_hub==1.33.0",
  "loguru==0.7.2",
  "rich>=13.9,<14",
  "setuptools>=70.0.0,<81",
  "torch==2.10.0; sys_platform == 'darwin'",
  "torchaudio==2.10.0; sys_platform == 'darwin'",
  "torchvision==0.25.0; sys_platform == 'darwin'",
  "transformers @ https://github.com/huggingface/transformers/archive/27166ea03f12c940f23176a904ab1d2ff1a3dcbb.zip",
]

# Linux picks exactly one: `uv sync --extra cuda` or `uv sync --extra cpu`.
# macOS needs neither; it installs PyPI PyTorch and runs R2T2 through Rust.
[project.optional-dependencies]
cuda = [
  "torch==2.13.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchaudio==2.11.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.28.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "flashinfer-cubin==0.6.18.post1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-nccl-cu13==2.29.7; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "vllm[audio]==0.30.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
cpu = [
  "torch==2.13.0; sys_platform == 'linux'",
  "torchaudio==2.11.0; sys_platform == 'linux'",
  "torchvision==0.28.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
conflicts = [[{ extra = "cuda" }, { extra = "cpu" }]]

[tool.uv.sources]
flashinfer-cubin = { index = "flashinfer" }
torch = [
  { index = "pytorch-cu130", extra = "cuda" },
  { index = "pytorch-cpu", extra = "cpu" },
]
torchaudio = [
  { index = "pytorch-cu130", extra = "cuda" },
  { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
  { index = "pytorch-cu130", extra = "cuda" },
  { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl"
explicit = true

# Match the published wheel metadata without downloading 1.5 GiB on macOS.
[[tool.uv.dependency-metadata]]
name = "flashinfer-cubin"
version = "0.6.18.post1"
requires-python = ">=3.8"
requires-dist = []
