name: asrserve
services:
  asr:
    image: quantatrisk/asrserve:gpu
    ports:
      - "17003:8000"
    shm_size: 4gb
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ASR_GPU:-0}"]
              capabilities: [gpu]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./models:/app/models
